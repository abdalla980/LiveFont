<!DOCTYPE html>
<html>
<head>
    <style>
        body { width: 200px; font-family: sans-serif; padding: 12px; }
        select, button { width: 100%; padding: 8px; margin-top: 8px; border-radius: 4px; }
        button { background-color: #2563eb; color: white; border: none; cursor: pointer; }
        button:hover { background-color: #1d4ed8; }
    </style>
</head>
<body>
<label for="fontSelect"><strong>Pick a Font:</strong></label>
<select id="fontSelect">
    <option value="Inter">Inter</option>
    <option value="Roboto">Roboto</option>
    <option value="Playfair Display">Playfair Display</option>
    <option value="Poppins">Poppins</option>
    <option value="Space Grotesk">Space Grotesk</option>
</select>
<button id="applyBtn">Apply Font</button>

<script src="popup.js"></script>
</body>
</html>
