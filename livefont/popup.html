<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            width: 230px;
            padding: 12px;
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #09090b;
            color: #f4f4f5;
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid #27272a;
        }
        .title {
            font-size: 13px;
            font-weight: 600;
            letter-spacing: -0.01em;
            color: #f4f4f5;
        }
        .badge {
            font-size: 10px;
            color: #a1a1aa;
            background-color: #18181b;
            padding: 2px 6px;
            border-radius: 4px;
            border: 1px solid #27272a;
        }
        label {
            display: block;
            font-size: 11px;
            font-weight: 500;
            color: #a1a1aa;
            margin-bottom: 6px;
        }
        select {
            width: 100%;
            padding: 8px 10px;
            border-radius: 6px;
            border: 1px solid #27272a;
            background-color: #18181b;
            color: #f4f4f5;
            font-size: 13px;
            outline: none;
            cursor: pointer;
            transition: border-color 0.15s ease;
        }
        select:focus {
            border-color: #52525b;
        }
        optgroup {
            font-weight: 600;
            color: #a1a1aa;
            background-color: #09090b;
        }
        option {
            color: #f4f4f5;
            background-color: #18181b;
        }
        .status {
            margin-top: 10px;
            font-size: 10px;
            color: #71717a;
            text-align: center;
        }
    </style>
</head>
<body>
<div class="header">
    <span class="title">LiveFonty</span>
    <span class="badge">v1.0</span>
</div>

<label for="fontSelect">Select Font Style</label>
<select id="fontSelect">
    <option value="" disabled selected>Choose a font...</option>

    <optgroup label="Modern Sans">
        <option value="Inter">Inter</option>
        <option value="Roboto">Roboto</option>
        <option value="Poppins">Poppins</option>
        <option value="Montserrat">Montserrat</option>
        <option value="Plus Jakarta Sans">Plus Jakarta Sans</option>
    </optgroup>

    <optgroup label="Serif & Editorial">
        <option value="Playfair Display">Playfair Display</option>
        <option value="Lora">Lora</option>
        <option value="Merriweather">Merriweather</option>
        <option value="Cormorant Garamond">Cormorant Garamond</option>
    </optgroup>

    <optgroup label="Display & Tech">
        <option value="Space Grotesk">Space Grotesk</option>
        <option value="Syne">Syne</option>
        <option value="Outfit">Outfit</option>
        <option value="Oswald">Oswald</option>
    </optgroup>

    <optgroup label="Monospace">
        <option value="Fira Code">Fira Code</option>
        <option value="JetBrains Mono">JetBrains Mono</option>
        <option value="Space Mono">Space Mono</option>
    </optgroup>
</select>

<div class="status">Live preview enabled</div>

<script src="popup.js"></script>
</body>
</html>
